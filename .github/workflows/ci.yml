name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and test
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/intelligent_saas
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: intelligent_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d intelligent_saas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Check lint
        run: uv run ruff check .

      - name: Check format
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
